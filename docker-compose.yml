version: "3.8"
services:
  postgres:
    image: postgres:16-alpine
    container_name: fm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fm
      POSTGRES_PASSWORD: fm_dev_password
      POSTGRES_DB: fm_platform
    ports:
      - "5432:5432"
    volumes:
      - fm_pg_data:/var/lib/postgresql/data

volumes:
  fm_pg_data: